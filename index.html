<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <!-- Names the game and nothing else. The no-tutorial rule covers what a
         link preview says as much as what the page does, so there is no "use
         the arrow keys" hiding in the head. -->
    <meta name="description" content="Snake, in a browser tab. One board, one snake, one way it ends." />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hud">
      <h1>Snake</h1>
      <nav aria-label="Primary"><a href="./">Home</a></nav>
      <p class="score"><span id="score">0</span></p>
    </header>
    <main>
      <!-- Sized by main.ts against this wrapper, so a mid-play resize is just
           another measurement rather than a broken board. -->
      <div class="board" id="board">
        <canvas id="canvas" width="600" height="600"></canvas>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
